name: CI

on:
  push:
  pull_request:

jobs:
  static-and-unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pyyaml matplotlib numpy websocket-client websockets pytest ruff
      - name: Compile Python sources
        run: python -m compileall Lara scripts tests
      - name: Lint touched runtime scripts
        run: |
          ruff check \
            scripts/run_lara_libero100_experiment.py \
            scripts/preflight_libero100_storage.py \
            scripts/visualize_lara_routes.py \
            scripts/eval_libero100_headless.py \
            deployment/model_server/tools/websocket_policy_server.py
      - name: Unit tests
        run: python -m unittest tests.test_libero100_experiment_scripts tests.test_libero100_eval_headless tests.test_websocket_policy_server
