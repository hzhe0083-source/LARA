run_id: so101_latent_action
run_root_dir: checkpoints
seed: 42
trackers:
- json
is_debug: false

framework:
  name: Lara
  qwenvl:
    base_vlm: ./models/Qwen3-VL-2B-Instruct
    attn_implementation: flash_attention_2
    vl_hidden_dim: 2048
  action_model:
    action_model_type: DiT-B
    action_hidden_dim: 1024
    hidden_size: 1024
    add_pos_embed: true
    max_seq_len: 1024
    action_dim: 7
    state_dim: 8
    # 30Hz SO101: predict 60 frames (2.0s), execute first 10 frames (0.333s), then re-observe.
    future_action_window_size: 59
    action_horizon: 60
    execution_horizon: 10
    latent_action_horizon: 10
    router_horizon: 10
    utility_horizon: 10
    long_prediction_aux_horizon: 60
    execution_loss_weight: 1.0
    prediction_loss_weight: 0.5
    past_action_window_size: 0
    repeated_diffusion_steps: 8
    use_latent_action_tokens: true
    use_latent_action_head: false
    lara_num_latent_tokens: 4
    lara_codebook_size: 128
    lara_latent_hidden_dim: 1024
    lara_commitment_weight: 0.25
    lara_vq_loss_weight: 1.0
    lara_prior_loss_weight: 1.0
    lara_code_usage_loss_weight: 0.0
    lara_code_usage_temperature: 1.0
    lara_use_transition_head: false
    lara_transition_hidden_dim: 1024
    lara_transition_loss_weight: 0.0
    lara_execution_transition_loss_weight: 1.0
    lara_prediction_transition_loss_weight: 1.0
    use_lara_moe: false
    lara_num_experts: 8
    lara_episode_pool_size: 4
    lara_episode_pool_size_min:
    lara_top_k: 2
    lara_expert_hidden_dim: 1024
    lara_router_hidden_dim: 1024
    lara_router_loss_weight: 1.0
    lara_pool_loss_weight: 1.0
    lara_utility_loss_weight: 0.0
    lara_utility_rank_loss_weight: 0.0
    lara_utility_head_loss_weight: 0.0
    lara_use_action_loss_utility: false
    lara_action_loss_utility_temperature: 1.0
    lara_action_loss_utility_normalize: true
    lara_route_retention_fractions: [0.25, 0.5, 1.0]
    lara_use_utility_head: false
    lara_utility_hidden_dim: 1024
    lara_utility_progress_weight: 1.0
    lara_utility_uncertainty_weight: 1.0
    lara_utility_cost_weight: 1.0
    lara_balance_loss_weight: 0.0
    lara_stickiness_loss_weight: 0.0
    lara_diversity_loss_weight: 0.0
    lara_entropy_loss_weight: 0.0
    lara_inference_stickiness_weight: 0.0
    lara_use_direct_action_experts: false
    lara_use_direct_action_output: false
    lara_direct_expert_hidden_dim: 1024
    lara_direct_expert_loss_weight: 1.0
    lara_posterior_temperature: 1.0
    lara_posterior_uniform_floor: 0.0
    lara_posterior_top_r:
    lara_use_expert_loss_posterior: true
    lara_expert_residual_scale: 0.1
    noise_beta_alpha: 1.5
    noise_beta_beta: 1.0
    noise_s: 0.999
    num_timestep_buckets: 1000
    num_inference_timesteps: 4
    num_target_vision_tokens: 32
    diffusion_model_cfg:
      cross_attention_dim: 2048
      dropout: 0.2
      final_dropout: true
      interleave_self_attention: true
      norm_type: ada_norm
      num_layers: 16
      output_dim: 1024
      positional_embeddings: null
  vj2_model:
    base_encoder: ./models/vjepa2-vitl-fpc64-256
    depth: 12
    num_heads: 8
    # V-JEPA predictor/checkpoint is built for two view streams; SO101 single-camera batches duplicate the view.
    num_world_model_views: 2
    special_action_token: <|action_{}|>
    num_action_tokens_per_timestep: 8
    embodied_action_token: <|embodied_action|>
    num_embodied_action_tokens_per_instruction: 32
    num_frames: 8
  reduce_in_full_precision: true

datasets:
  vla_data:
    dataset_py: lerobot_datasets
    data_root_dir: /home/ryan/Documents/robot/VLA_JEPA/runs/lerobot_so101
    data_mix: so101_single_arm
    action_type: delta_qpos
    CoT_prompt: "Your task is {instruction}. Infer the temporal dynamics from frames {actions} and produce the corresponding policy actions {e_actions}."
    resolution_size: 224
    video_resolution_size: 256
    per_device_batch_size: 8
    load_all_data_for_training: true
    with_state: true

trainer:
  epochs: 100
  max_train_steps: 20000
  num_warmup_steps: 2000
  save_interval: 5000
  eval_interval: 100
  learning_rate:
    base: 3.0e-05
    qwen_vl_interface: 1.0e-05
    action_model: 1.0e-04
    vj_predictor: 5.0e-04
  lr_scheduler_type: cosine_with_min_lr
  scheduler_specific_kwargs:
    min_lr: 1.0e-06
  freeze_modules: ''
  loss_scale:
    vla: 1.0
    vlm: 0.1
  max_grad_norm: 1.0
  warmup_ratio: 0.1
  weight_decay: 0.0
  logging_frequency: 10
  gradient_clipping: 1.0
  gradient_accumulation_steps: 1
  pretrained_checkpoint: ./models/VLA-JEPA/Pretrain/checkpoints/VLA-JEPA-pretrain.pt
  reload_modules: qwen,vj2

  optimizer:
    name: AdamW
    betas:
    - 0.9
    - 0.95
    eps: 1.0e-08
    weight_decay: 1.0e-08

  is_resume: false
  resume_epoch: null
  resume_step: null
  enable_gradient_checkpointing: true
  enable_mixed_precision_training: true
