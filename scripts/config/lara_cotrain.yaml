run_id: cotrain
run_root_dir: checkpoints
seed: 42
trackers: [json]
#wandb_entity: your_wandb_entity
#wandb_project: llavavla
is_debug: false

framework:
  name: Lara
  qwenvl:
    base_vlm: ./models/Qwen3-VL-2B-Instruct
    attn_implementation: flash_attention_2
    vl_hidden_dim: 2048
  action_model:
    action_model_type: DiT-B
    action_hidden_dim: 1024     # TODO merge with hidden_size, in config v2
    hidden_size: 1024     
    add_pos_embed: True
    max_seq_len: 1024
    action_dim: 7
    state_dim: 8
    future_action_window_size: 6
    action_horizon: 7 # need merge with future_action_window_size 
    execution_horizon: 7
    latent_action_horizon: 7
    router_horizon: 7
    utility_horizon: 7
    long_prediction_aux_horizon: 7
    execution_loss_weight: 1.0
    prediction_loss_weight: 0.5
    past_action_window_size: 0
    repeated_diffusion_steps: 8
    use_latent_action_tokens: true
    use_latent_action_head: true
    lara_num_latent_tokens: 4
    lara_codebook_size: 128
    lara_latent_hidden_dim: 1024
    lara_latent_reconstruction_loss_weight: 1.0
    lara_commitment_weight: 0.25
    lara_vq_loss_weight: 1.0
    lara_prior_loss_weight: 1.0
    lara_code_usage_loss_weight: 0.0
    lara_code_usage_temperature: 1.0
    lara_use_transition_head: true
    lara_transition_hidden_dim: 1024
    lara_transition_loss_weight: 1.0
    lara_execution_transition_loss_weight: 1.0
    lara_prediction_transition_loss_weight: 1.0
    use_lara_moe: true
    lara_num_experts: 8
    lara_episode_pool_size: 4
    lara_episode_pool_size_min:
    lara_top_k: 2
    lara_expert_hidden_dim: 1024
    lara_router_hidden_dim: 1024
    lara_router_loss_weight: 1.0
    lara_pool_loss_weight: 1.0
    lara_pool_target_avg_weight: 1.0
    lara_pool_target_max_weight: 1.0
    lara_pool_target_utility_weight: 0.0
    lara_pool_coverage_loss_weight: 0.25
    lara_pool_critical_threshold: 0.2
    lara_utility_loss_weight: 1.0
    lara_utility_rank_loss_weight: 0.25
    lara_utility_head_loss_weight: 1.0
    lara_use_action_loss_utility: true
    lara_use_action_loss_utility_components: true
    lara_action_loss_utility_temperature: 1.0
    lara_action_loss_utility_normalize: true
    lara_use_state_utility: true
    lara_use_state_utility_components: true
    lara_state_utility_temperature: 1.0
    lara_state_utility_normalize: true
    lara_route_retention_fractions: [0.25, 0.5, 1.0]
    lara_use_utility_head: true
    lara_utility_hidden_dim: 1024
    lara_utility_progress_weight: 1.0
    lara_utility_uncertainty_weight: 1.0
    lara_utility_cost_weight: 1.0
    lara_balance_loss_weight: 0.0
    lara_stickiness_loss_weight: 0.0
    lara_diversity_loss_weight: 0.0
    lara_entropy_loss_weight: 0.0
    lara_inference_stickiness_weight: 0.0
    lara_use_direct_action_experts: true
    lara_use_direct_action_output: true
    lara_direct_expert_hidden_dim: 1024
    lara_direct_expert_loss_weight: 1.0
    lara_posterior_temperature: 1.0
    lara_posterior_uniform_floor: 0.0
    lara_posterior_top_r:
    lara_use_expert_loss_posterior: true
    lara_expert_residual_scale: 0.1
    noise_beta_alpha: 1.5
    noise_beta_beta: 1.0
    noise_s: 0.999
    num_timestep_buckets: 1000
    num_inference_timesteps: 4
    num_target_vision_tokens: 32
    diffusion_model_cfg:    
      cross_attention_dim: 2048
      dropout: 0.2
      final_dropout: true
      interleave_self_attention: true
      norm_type: "ada_norm"
      num_layers: 16
      output_dim: 1024
      positional_embeddings: null
  vj2_model:
    base_encoder: ./models/vjepa2-vitl-fpc64-256
    depth: 12
    num_heads: 8
    special_action_token: "<|action_{}|>"
    num_action_tokens_per_timestep: 8
    embodied_action_token: "<|embodied_action|>"
    num_embodied_action_tokens_per_instruction: 32
    num_frames: 8
  reduce_in_full_precision: true


datasets:
  vla_data:
    dataset_py: lerobot_datasets
    data_root_dir: /home/dataset-local/datasets/LeRobot/droid
    data_mix: droid
    action_type: delta_qpos
    CoT_prompt: "Your task is {instruction}. Infer the temporal dynamics from frames {actions} and produce the corresponding policy actions {e_actions}."
    resolution_size: 224   # image input of VLA will be resized and video will not, video will be precessed by world model videoprocessor
    video_resolution_size: 256
    per_device_batch_size: 16
    load_all_data_for_training: true
    with_state: false
  video_data:
    dataset_py: video_datasets
    video_dir: /home/dataset-local/datasets/ssv2/20bn-something-something-v2
    text_file: /home/dataset-local/datasets/ssv2/test-answers.csv
    CoT_prompt: "Your task is {instruction}. Infer the temporal dynamics of future frames {actions}."
    extensions: [webm]
    resolution_size: 224
    video_resolution_size: 256
    per_device_batch_size: 16


trainer:
  epochs: 100
  max_train_steps: 50000
  num_warmup_steps: 5000
  #num_warmup_steps: 0
  save_interval: 10000
  eval_interval: 100
  learning_rate:
    base: 3.0e-05
    qwen_vl_interface: 1.0e-05
    action_model: 1.0e-04
  lr_scheduler_type: cosine_with_min_lr
  scheduler_specific_kwargs:
    min_lr: 1.0e-06
  freeze_modules: ''
  loss_scale:
    vla: 1.0
    vlm: 0.1
    wm: 0.1
  max_grad_norm: 1.0
  warmup_ratio: 0.1
  weight_decay: 0.0
  logging_frequency: 10
  gradient_clipping: 1.0
  gradient_accumulation_steps: 1
  

  optimizer:
    name: AdamW
    betas: [0.9, 0.95]
    eps: 1.0e-08
    weight_decay: 1.0e-08

  # parameters to be determined
  is_resume: false
  resume_epoch: null
  resume_step: null
  enable_gradient_checkpointing: true
  enable_mixed_precision_training: true
